<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="styles.css"><script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getStorage } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDpxXFVedd9CHBPg5XFHelk0GoeIogoZRQ",
    authDomain: "mahadev-fabric-care.firebaseapp.com",
    projectId: "mahadev-fabric-care",
    storageBucket: "mahadev-fabric-care.firebasestorage.app",
    messagingSenderId: "202268296150",
    appId: "1:202268296150:web:0a8e168d18d120144e1a77",
    measurementId: "G-DYLTMEQMER"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const storage = getStorage(app);

  window.MF = { app, analytics, db, auth, storage };
</script>
</head><body>
<main class="container">
  <h2>Admin Dashboard</h2>
  <p>Enable Firebase Auth in console and create an admin user. Then use the admin.html features.</p>
  <div id="bookings"></div>
  <div id="reviews"></div>
</main>
<script>
  (async function(){
    const db = window.MF && window.MF.db;
    if(!db) return;
    const bcol = window.MF.collection(db,'bookings');
    window.MF.onSnapshot(bcol,(snap)=>{ const el=document.getElementById('bookings'); el.innerHTML=''; snap.forEach(function(doc){ var d=doc.data(); el.innerHTML += '<div class="card"><strong>'+d.name+'</strong> - '+d.service+' - '+d.status+'</div>'; }); });
    const rcol = window.MF.collection(db,'reviews');
    window.MF.onSnapshot(rcol,(snap)=>{ const el=document.getElementById('reviews'); el.innerHTML=''; snap.forEach(function(doc){ var d=doc.data(); el.innerHTML += '<div class="card"><strong>'+d.name+'</strong> - '+d.rating+'★<p>'+d.message+'</p></div>'; }); });
  })();
</script>
</body></html>
